[package]
name = "spore-bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The RustSpore binary. Wires the core crates into a Bevy app."

[[bin]]
name = "rustspore"
path = "src/main.rs"

[[example]]
name = "source_ui_shader_probe"
required-features = ["native_shader_probe"]

[[example]]
name = "source_cell_shader_probe"
required-features = ["native_shader_probe"]

[features]
default = ["native_renderer"]
native_renderer = ["dep:windows"]
native_shader_probe = ["native_renderer"]

[dependencies]
bevy.workspace = true
dbpf.workspace = true
spore-core.workspace = true

# PNG resources are standard PNG files, so decoding them is not format work. The
# crate is already in the tree through Bevy; this only names it directly.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D9", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sha2 = "0.10"
